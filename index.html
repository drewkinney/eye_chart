<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Chart — Visual Acuity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap">
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:            #1A1A18;
      --paper:          #F9F7F4;
      --bg:             #282826;
      --chrome-bg:      #131311;
      --chrome-surface: #1E1E1C;
      --chrome-border:  #2E2E2C;
      --chrome-text:    #C8C8C4;
      --chrome-muted:   #585856;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    /* ── Speech bubble toggle ──────────────────────────── */

    .overlay-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 400;
      width: 42px;
      height: 42px;
      background: var(--chrome-bg);
      border: 1px solid var(--chrome-border);
      color: var(--chrome-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, border-color 0.15s;
    }

    .overlay-btn:hover { color: var(--chrome-text); border-color: #484846; }

    .overlay-btn svg { width: 18px; height: 18px; }

    .overlay-btn.is-active { color: var(--paper); border-color: #585856; }

    /* ── Overlay backdrop ──────────────────────────────── */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s;
    }

    .overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Overlay card ──────────────────────────────────── */

    .overlay-card {
      background: var(--chrome-bg);
      border: 1px solid var(--chrome-border);
      width: 620px;
      max-width: calc(100vw - 40px);
      padding: 22px 22px 16px;
      transform: translateY(10px);
      transition: transform 0.18s;
    }

    .overlay.is-open .overlay-card { transform: translateY(0); }

    .overlay-eyebrow {
      display: block;
      color: var(--chrome-muted);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 100px;
      max-height: 220px;
      background: var(--chrome-surface);
      color: var(--chrome-text);
      border: 1px solid var(--chrome-border);
      padding: 10px 12px;
      font-family: 'Courier Prime', Courier, monospace;
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: #484846; }
    textarea::placeholder { color: var(--chrome-muted); }

    .overlay-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    /* ── Font picker ───────────────────────────────────── */

    .font-picker { position: relative; }

    .fp-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--chrome-surface);
      color: var(--chrome-text);
      border: 1px solid var(--chrome-border);
      padding: 6px 10px 6px 12px;
      font-size: 13px;
      cursor: pointer;
      min-width: 172px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
    }

    .fp-btn:hover { border-color: #484846; }

    .fp-btn-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fp-btn svg { flex-shrink: 0; opacity: 0.5; }

    .fp-drop {
      position: absolute;
      bottom: calc(100% + 4px);
      left: 0;
      z-index: 500;
      background: var(--chrome-bg);
      border: 1px solid var(--chrome-border);
      width: 240px;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.6);
    }

    .fp-drop[hidden] { display: none; }

    .fp-search {
      display: block;
      width: 100%;
      background: var(--chrome-surface);
      color: var(--chrome-text);
      border: none;
      border-bottom: 1px solid var(--chrome-border);
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
    }

    .fp-search::placeholder { color: var(--chrome-muted); }

    .fp-list {
      overflow-y: auto;
      max-height: 260px;
      overscroll-behavior: contain;
    }

    .fp-item {
      padding: 7px 12px;
      font-size: 15px;
      color: var(--chrome-text);
      cursor: pointer;
      line-height: 1.25;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      opacity: 0.35;
      transition: opacity 0.25s, background 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fp-item:hover  { background: var(--chrome-surface); }
    .fp-item.loaded { opacity: 1; }
    .fp-item.active { color: var(--paper); opacity: 1; }

    /* ── Print button ──────────────────────────────────── */

    .btn-print {
      margin-left: auto;
      background: var(--paper);
      color: var(--ink);
      border: none;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.12s;
      white-space: nowrap;
    }

    .btn-print:hover { opacity: 0.78; }

    /* ── Output wrapper ────────────────────────────────── */

    #output {
      padding: 44px 24px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }

    #output.is-empty::after {
      content: 'Open the editor to paste a narrative.';
      display: block;
      color: #3A3A38;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 80px;
    }

    /* ── Chart page ────────────────────────────────────── */

    .chart-page {
      width: 816px;
      min-height: 1056px;
      background: var(--paper);
      padding: 72px;
      box-shadow: 0 6px 48px rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24pt;
    }

    .chart-rule {
      flex: 1;
      height: 0.5px;
      background: var(--ink);
      opacity: 0.2;
    }

    .chart-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 6pt;
      font-weight: 500;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--ink);
      opacity: 0.3;
      white-space: nowrap;
      padding-right: 0.5em;
    }

    .chart-rows {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 42pt 1fr 42pt;
      align-items: baseline;
      padding: 3pt 0;
      border-top: 0.25pt solid rgba(26,26,24,0.07);
    }

    .chart-row:last-child {
      border-bottom: 0.25pt solid rgba(26,26,24,0.07);
    }

    .acuity {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 6pt;
      letter-spacing: 0.03em;
      color: var(--ink);
      opacity: 0.32;
      line-height: 1;
      white-space: nowrap;
    }

    .acuity-l { text-align: right; padding-right: 9pt; }
    .acuity-r { text-align: left;  padding-left:  9pt; }

    .chart-text {
      display: block;
      text-align: center;
      color: var(--ink);
      line-height: 1.1;
      letter-spacing: 0.1em;
      padding-right: 0.1em;
      white-space: nowrap;
      overflow: visible;
    }

    /* ── Print ─────────────────────────────────────────── */

    @media print {
      .no-print { display: none !important; }
      .overlay-btn { display: none !important; }

      body { background: white; }

      #output { padding: 0; gap: 0; }

      .chart-page {
        width: 100%;
        min-height: unset;
        padding: 0;
        box-shadow: none;
        break-after: page;
        page-break-after: always;
      }

      .chart-page:last-child {
        break-after: avoid;
        page-break-after: avoid;
      }

      @page { size: letter portrait; margin: 0.75in; }
    }

  </style>
</head>

<!-- ── Speech bubble toggle ─────────────────────────────── -->
<button class="overlay-btn no-print" id="overlayBtn" aria-label="Edit narrative">

  </svg>
</button>

<!-- ── Input overlay ─────────────────────────────────────── -->
<div class="overlay no-print" id="overlay">

      spellcheck="false"

    <div class="overlay-footer">
      <div class="font-picker" id="fontPicker">
        <button class="fp-btn" id="fpBtn" type="button">
          <span class="fp-btn-label" id="fpLabel">Courier Prime</span>
          <svg width="8" height="5" viewBox="0 0 8 5" fill="currentColor">
            <path d="M0 0l4 5 4-5z"/>
          </svg>
        </button>
        <div class="fp-drop" id="fpDrop" hidden>
          <input class="fp-search" id="fpSearch" placeholder="Search fonts…" autocomplete="off" spellcheck="false">
          <div class="fp-list" id="fpList"></div>
        </div>
      </div>
      <button class="btn-print" onclick="window.print()">Print / Save PDF</button>
    </div>
  </div>
</div>

<!-- ── Chart output ──────────────────────────────────────── -->
<div id="output" class="is-empty"></div>

/* ══════════════════════════════════════════════════════════
   FONT PICKER
══════════════════════════════════════════════════════════ */

let currentFont   = "'Courier Prime', Courier, monospace";
let currentFamily = 'Courier Prime';

const fpBtn    = document.getElementById('fpBtn');
const fpLabel  = document.getElementById('fpLabel');
const fpDrop   = document.getElementById('fpDrop');
const fpSearch = document.getElementById('fpSearch');
const fpList   = document.getElementById('fpList');

const loadedFonts = new Set(['Courier Prime']);

function gfUrl(name) {
  return `https://fonts.googleapis.com/css2?family=${name.replace(/ /g,'+')}:wght@400&display=swap`;
}

function loadFont(name) {
  if (loadedFonts.has(name)) return;
  loadedFonts.add(name);
  const link = document.createElement('link');
  link.rel  = 'stylesheet';
  link.href = gfUrl(name);
  document.head.appendChild(link);
}

/* IntersectionObserver: load font when its list item enters viewport */
const fontObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const name = entry.target.dataset.font;
    loadFont(name);
    /* Mark loaded after a brief delay (CSS transition) */
    setTimeout(() => entry.target.classList.add('loaded'), 120);
    fontObserver.unobserve(entry.target);
  });
}, { root: fpList, rootMargin: '80px', threshold: 0 });

function buildList(query) {
  /* Disconnect old observations */
  fpList.querySelectorAll('.fp-item').forEach(el => fontObserver.unobserve(el));
  fpList.innerHTML = '';

  const q = query.trim().toLowerCase();
  const hits = q
    ? GOOGLE_FONTS.filter(f => f.toLowerCase().includes(q))
    : GOOGLE_FONTS;

  hits.forEach(name => {
    const el = document.createElement('div');
    el.className   = 'fp-item' + (name === currentFamily ? ' active loaded' : '');
    el.textContent = name;
    el.style.fontFamily = `'${name}', sans-serif`;
    el.dataset.font = name;
    /* Items for already-loaded fonts are immediately visible */
    if (loadedFonts.has(name)) el.classList.add('loaded');
    fpList.appendChild(el);
    fontObserver.observe(el);
  });

  fpList.scrollTop = 0;
}

/* Toggle dropdown */
fpBtn.addEventListener('click', e => {
  e.stopPropagation();
  const opening = fpDrop.hidden;
  fpDrop.hidden = !opening;
  if (opening) {
    fpSearch.value = '';
    buildList('');
    fpSearch.focus();
    /* Scroll active item into view */
    setTimeout(() => {
      const active = fpList.querySelector('.active');
      if (active) active.scrollIntoView({ block: 'nearest' });
    }, 0);
  }
});

/* Filter on search */
fpSearch.addEventListener('input', () => buildList(fpSearch.value));

/* Select a font */
fpList.addEventListener('click', e => {
  const item = e.target.closest('.fp-item');
  if (!item) return;
  const name = item.dataset.font;
  currentFamily = name;
  currentFont   = `'${name}', sans-serif`;
  fpLabel.textContent = name;
  fpLabel.style.fontFamily = currentFont;
  fpDrop.hidden = true;
  render();
});

/* Close on outside click */
document.addEventListener('click', () => { fpDrop.hidden = true; });
fpDrop.addEventListener('click', e => e.stopPropagation());

/* ══════════════════════════════════════════════════════════
   OVERLAY
══════════════════════════════════════════════════════════ */

const overlay    = document.getElementById('overlay');
const overlayBtn = document.getElementById('overlayBtn');
const overlayCard = document.getElementById('overlayCard');

function openOverlay() {
  overlay.classList.add('is-open');
  overlayBtn.classList.add('is-active');
  document.getElementById('narrative').focus();
}

function closeOverlay() {
  overlay.classList.remove('is-open');
  overlayBtn.classList.remove('is-active');
}

overlayBtn.addEventListener('click', () => {
  overlay.classList.contains('is-open') ? closeOverlay() : openOverlay();
});

/* Click backdrop to close */
overlay.addEventListener('click', e => {
  if (!overlayCard.contains(e.target)) closeOverlay();
});

/* Escape to close */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!fpDrop.hidden) { fpDrop.hidden = true; return; }
    closeOverlay();
  }
});

/* Open on launch */
openOverlay();

/* ══════════════════════════════════════════════════════════
   CHART LOGIC
══════════════════════════════════════════════════════════ */

function buildChart(raw) {
  const text = raw.replace(/\s+/g, ' ').trim();
  if (!text) return null;

  let cursor = 0;
  const rows = [];

  for (const def of LINE_ROWS) {
    if (cursor >= text.length) break;

    if (text[cursor] === ' ') cursor++;
    if (cursor >= text.length) break;

    const end   = Math.min(cursor + def.chars, text.length);
    let   slice = text.slice(cursor, end).trimEnd();
    cursor = end;

    if (slice.length > 0) rows.push({ ...def, text: slice });
  }

  return rows.length ? rows : null;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const raw    = document.getElementById('narrative').value;
  const output = document.getElementById('output');
  const rows   = buildChart(raw);

  if (!rows) {
    output.innerHTML = '';
    output.classList.add('is-empty');
    return;
  }

  output.classList.remove('is-empty');
  output.innerHTML = `
    <div class="chart-page" style="font-family:${currentFont}">
      <div class="chart-header">
        <span class="chart-rule"></span>
        <span class="chart-title">Visual Acuity</span>
        <span class="chart-rule"></span>
      </div>
      <div class="chart-rows">
        ${rows.map(r => `
          <div class="chart-row">
            <span class="acuity acuity-l">${esc(r.acuity)}</span>
            <span class="chart-text" style="font-size:${r.size}pt">${esc(r.text)}</span>
            <span class="acuity acuity-r">${esc(r.metric)}</span>
          </div>`).join('')}
      </div>
    </div>`;
}

document.getElementById('narrative').addEventListener('input', render);
</script>
